<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
  <title>MayaClone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #050508;
      --surface: #0d0d14;
      --surface-2: #16161f;
      --border: rgba(255, 255, 255, 0.06);
      --text: #f5f5fa;
      --text-muted: #6b6b80;
      --accent: #8b5cf6;
      --accent-2: #a78bfa;
      --listening: #10b981;
      --listening-glow: rgba(16, 185, 129, 0.4);
      --speaking: #8b5cf6;
      --speaking-glow: rgba(139, 92, 246, 0.5);
      --thinking: #f59e0b;
      --thinking-glow: rgba(245, 158, 11, 0.3);
      --error: #ef4444;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.15), transparent),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(16, 185, 129, 0.08), transparent);
      color: var(--text);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      touch-action: manipulation;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
    }

    .container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      max-height: 100vh;
      max-height: 100svh;
      max-height: 100dvh;
      max-width: 420px;
      margin: 0 auto;
      padding: 0 20px;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      position: relative;
      padding: 28px 0 18px;
      display: flex;
      justify-content: center;
      isolation: isolate;
      flex: 0 0 auto;
    }

    .header::before {
      content: "";
      position: absolute;
      inset: -12px 8% auto;
      height: 92px;
      background:
        radial-gradient(circle at 24% 28%, rgba(0, 255, 209, 0.16), transparent 32%),
        radial-gradient(circle at 76% 18%, rgba(255, 0, 178, 0.18), transparent 34%),
        linear-gradient(180deg, rgba(7, 9, 18, 0.84), rgba(7, 9, 18, 0));
      filter: blur(14px);
      pointer-events: none;
      z-index: -1;
    }

    .header::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 2px;
      width: min(260px, 58vw);
      height: 1px;
      transform: translateX(-50%);
      background: linear-gradient(90deg, transparent, rgba(0, 255, 209, 0.55), rgba(255, 0, 178, 0.38), transparent);
      opacity: 0.8;
    }

    .header-brand {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 18px 16px;
    }

    .header-brand::before {
      content: "";
      position: absolute;
      inset: 10px -10px 2px;
      background:
        radial-gradient(circle at 28% 44%, rgba(0, 255, 209, 0.14), transparent 36%),
        radial-gradient(circle at 74% 40%, rgba(255, 0, 178, 0.16), transparent 40%);
      filter: blur(22px);
      opacity: 0.85;
      pointer-events: none;
      z-index: -1;
    }

    .header-brand h1 {
      font-family: "Space Grotesk", "Avenir Next", "Segoe UI", sans-serif;
      font-size: clamp(34px, 7vw, 48px);
      line-height: 1.04;
      font-weight: 700;
      letter-spacing: -0.055em;
      color: transparent;
      background:
        linear-gradient(92deg,
          rgba(240, 244, 255, 0.98) 0%,
          rgba(151, 255, 232, 0.96) 28%,
          rgba(105, 228, 255, 0.98) 48%,
          rgba(255, 132, 224, 0.96) 78%,
          rgba(248, 244, 255, 0.98) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow:
        0 0 18px rgba(0, 255, 209, 0.14),
        0 0 28px rgba(255, 0, 178, 0.1);
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.28));
      white-space: nowrap;
    }

    /* Session memory controls */
    .memory-hint {
      max-width: 340px;
      text-align: center;
      font-size: 12px;
      line-height: 1.35;
      color: rgba(245, 245, 250, 0.55);
      margin-top: -6px;
    }

    .memory-hint strong {
      color: rgba(245, 245, 250, 0.78);
      font-weight: 650;
    }

    .memory-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .memory-reset {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(245, 245, 250, 0.82);
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .memory-reset:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 6px 0 14px;
      position: relative;
      z-index: 5;
      pointer-events: auto;
      flex: 0 0 auto;
    }

    .control-btn {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        linear-gradient(180deg, rgba(24, 24, 33, 0.96) 0%, rgba(13, 13, 20, 0.94) 100%);
      color: rgba(245, 245, 250, 0.88);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      box-shadow:
        0 12px 28px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      transition: transform 160ms ease, border-color 180ms ease, background 180ms ease, color 180ms ease, box-shadow 180ms ease;
    }

    .control-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.16);
      background:
        linear-gradient(180deg, rgba(30, 30, 40, 0.98) 0%, rgba(16, 16, 25, 0.96) 100%);
    }

    .control-btn:active {
      transform: translateY(0);
    }

    .control-btn svg {
      width: 22px;
      height: 22px;
      stroke-width: 1.8;
    }

    .control-btn.muted {
      color: rgba(248, 113, 113, 0.95);
      border-color: rgba(248, 113, 113, 0.34);
      background:
        linear-gradient(180deg, rgba(62, 20, 26, 0.92) 0%, rgba(29, 11, 16, 0.94) 100%);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.36),
        0 0 0 1px rgba(248, 113, 113, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .control-btn.muted:hover {
      border-color: rgba(248, 113, 113, 0.46);
      background:
        linear-gradient(180deg, rgba(74, 22, 30, 0.96) 0%, rgba(36, 12, 19, 0.96) 100%);
    }

    /* ── Timer row ── */
    .timer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 0;
      flex: 0 0 auto;
    }

    .timer-row.hidden {
      display: none;
    }

    .hidden {
      display: none !important;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .status-dot.connected {
      background: var(--listening);
      box-shadow: 0 0 14px var(--listening);
    }

    .call-timer {
      font-size: 42px;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
    }

    /* ── Orb section ── */
    .orb-section {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      position: relative;
    }

    .orb-wrapper {
      position: relative;
      width: 236px;
      height: 236px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      --orb-energy: 0.16;
      --state-rgb: 131, 117, 255;
      --state-rgb-soft: 109, 95, 220;
      --orb-scale: 1;
      --orb-tilt-x: 0deg;
      --orb-tilt-y: 0deg;
      --user-level: 0;
      --assistant-level: 0;
      --state-transition: 920ms cubic-bezier(0.16, 1, 0.3, 1);
      filter: drop-shadow(0 26px 56px rgba(0, 0, 0, 0.42));
      transition: filter var(--state-transition);
      isolation: isolate;
    }

    .orb-backdrop,
    .orb-halo,
    .orb-aura {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .orb-backdrop {
      inset: -42px;
      background:
        radial-gradient(circle at 50% 50%, rgba(var(--state-rgb), 0.24) 0%, rgba(var(--state-rgb), 0.12) 24%, rgba(var(--state-rgb), 0.04) 48%, transparent 72%),
        radial-gradient(circle at 50% 68%, rgba(7, 10, 23, 0.58) 0%, transparent 62%);
      filter: blur(24px);
      opacity: calc(0.52 + var(--orb-energy) * 0.55 + var(--assistant-level) * 0.12);
      transform: scale(calc(0.94 + var(--orb-energy) * 0.22 + var(--assistant-level) * 0.06));
      transition: opacity var(--state-transition), transform var(--state-transition), background var(--state-transition);
    }

    .orb-halo {
      inset: -14px;
      background:
        conic-gradient(from 0deg,
          rgba(var(--state-rgb), 0.00),
          rgba(var(--state-rgb), 0.38),
          rgba(255, 255, 255, 0.07),
          rgba(var(--state-rgb-soft), 0.24),
          rgba(var(--state-rgb), 0.00)),
        radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.12), transparent 34%);
      mix-blend-mode: screen;
      filter: blur(14px);
      opacity: calc(0.24 + var(--orb-energy) * 0.72 + var(--assistant-level) * 0.18);
      animation: halo-orbit 10s linear infinite;
      transform: scale(calc(0.92 + var(--orb-energy) * 0.12 + var(--assistant-level) * 0.05));
      transition: opacity var(--state-transition), transform var(--state-transition);
    }

    .orb-aura {
      inset: -28px;
      filter: blur(30px);
      mix-blend-mode: screen;
      transition: opacity var(--state-transition), transform var(--state-transition), background var(--state-transition);
    }

    .orb-aura.idle {
      background:
        radial-gradient(circle at 50% 52%, rgba(var(--state-rgb-soft), 0.24), transparent 70%),
        radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.04), transparent 20%);
      opacity: calc(0.14 + var(--orb-energy) * 0.16 + var(--assistant-level) * 0.08);
      transform: scale(calc(0.94 + var(--orb-energy) * 0.08));
    }

    .orb-aura.listening {
      background:
        radial-gradient(circle at 50% 50%, rgba(var(--state-rgb), 0.24), transparent 68%),
        radial-gradient(circle at 36% 44%, rgba(var(--state-rgb-soft), 0.12), transparent 34%);
      opacity: calc(0.08 + var(--user-level) * 0.20 + var(--orb-energy) * 0.08);
      transform: scale(calc(0.92 + var(--user-level) * 0.16 + var(--orb-energy) * 0.05));
    }

    .orb-aura.thinking {
      background:
        radial-gradient(circle at 62% 40%, rgba(var(--state-rgb-soft), 0.20), transparent 36%),
        radial-gradient(circle at 44% 62%, rgba(var(--state-rgb), 0.16), transparent 42%);
      opacity: calc(0.10 + var(--orb-energy) * 0.12 + var(--assistant-level) * 0.06);
      transform: scale(calc(0.95 + var(--orb-energy) * 0.06));
    }

    .orb-aura.speaking {
      background:
        radial-gradient(circle at 50% 50%, rgba(var(--state-rgb), 0.20), transparent 66%),
        radial-gradient(circle at 62% 38%, rgba(var(--state-rgb-soft), 0.16), transparent 40%);
      opacity: calc(0.08 + var(--assistant-level) * 0.24 + var(--orb-energy) * 0.06);
      transform: scale(calc(0.96 + var(--assistant-level) * 0.12));
    }

    .orb-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid transparent;
      opacity: 0;
      will-change: transform, opacity;
      transition: transform 0.15s ease-out, opacity 0.18s ease-out, border-color var(--state-transition), box-shadow var(--state-transition);
      box-shadow: 0 0 0 1px rgba(var(--state-rgb), 0.06), inset 0 0 0 1px rgba(var(--state-rgb), 0.04);
    }

    .orb-ring.r1 {
      inset: 10px;
      border-style: solid;
      border-color: rgba(var(--state-rgb), 0.26);
    }

    .orb-ring.r2 {
      inset: -16px;
      border-style: dashed;
      border-color: rgba(var(--state-rgb), 0.22);
      animation: ring-spin 18s linear infinite;
    }

    .orb-ring.r3 {
      inset: -42px;
      border-style: dotted;
      border-color: rgba(var(--state-rgb), 0.18);
      animation: ring-spin 24s linear infinite reverse;
    }

    @keyframes ring-spin {
      0% {
        transform: scale(var(--ring-scale, 1)) rotate(0deg);
      }

      100% {
        transform: scale(var(--ring-scale, 1)) rotate(360deg);
      }
    }

    @keyframes halo-orbit {
      0% {
        transform: scale(calc(0.92 + var(--orb-energy) * 0.12)) rotate(0deg);
      }

      100% {
        transform: scale(calc(0.92 + var(--orb-energy) * 0.12)) rotate(360deg);
      }
    }

    @keyframes orb-breathe {
      0%,
      100% {
        transform: perspective(640px) rotateX(var(--orb-tilt-x)) rotateY(var(--orb-tilt-y)) scale(var(--orb-scale));
      }

      50% {
        transform: perspective(640px) rotateX(calc(var(--orb-tilt-x) + 1.5deg)) rotateY(calc(var(--orb-tilt-y) - 1.5deg)) scale(calc(var(--orb-scale) + 0.018));
      }
    }

    @keyframes plasma-swirl {
      0% {
        transform: rotate(0deg) scale(1.02);
      }

      50% {
        transform: rotate(180deg) scale(1.08);
      }

      100% {
        transform: rotate(360deg) scale(1.02);
      }
    }

    @keyframes sheen-drift {
      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(6px, -10px, 0);
      }
    }

    .orb {
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      overflow: hidden;
      overflow: clip;
      isolation: isolate;
      background:
        radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.06) 10%, transparent 34%),
        radial-gradient(circle at 68% 78%, rgba(var(--state-rgb), 0.12) 0%, transparent 34%),
        linear-gradient(145deg, rgba(26, 28, 46, 0.98) 0%, rgba(8, 10, 20, 0.98) 55%, rgba(6, 7, 16, 1) 100%);
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow:
        0 18px 38px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(var(--state-rgb), 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.07),
        inset 0 -24px 30px rgba(0, 0, 0, 0.36);
      transition: box-shadow var(--state-transition), border-color var(--state-transition), background var(--state-transition);
      will-change: transform, box-shadow;
      transform: perspective(640px) rotateX(var(--orb-tilt-x)) rotateY(var(--orb-tilt-y)) scale(calc(var(--orb-scale) + var(--assistant-level) * 0.05));
      animation: orb-breathe 5.6s ease-in-out infinite;
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      backface-visibility: hidden;
    }

    .orb-wrapper:active .orb {
      --orb-scale: 0.982;
    }

    .orb-core,
    .orb-voice,
    .orb-plasma,
    .orb-sheen,
    .orb-grid,
    .orb-tone {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transform: translateZ(0);
    }

    .orb-tone {
      inset: -8%;
      mix-blend-mode: screen;
      filter: blur(18px);
      transition: opacity var(--state-transition), transform var(--state-transition), background var(--state-transition);
    }

    .orb-tone.idle {
      background: radial-gradient(circle at 50% 50%, rgba(var(--state-rgb-soft), 0.18), transparent 70%);
      opacity: calc(0.12 + var(--orb-energy) * 0.10);
      transform: scale(calc(0.94 + var(--orb-energy) * 0.05));
    }

    .orb-tone.listening {
      background:
        radial-gradient(circle at 34% 30%, rgba(var(--state-rgb-soft), 0.16), transparent 28%),
        radial-gradient(circle at 60% 58%, rgba(var(--state-rgb), 0.14), transparent 46%);
      opacity: calc(0.07 + var(--user-level) * 0.18 + var(--orb-energy) * 0.04);
      transform: scale(calc(0.92 + var(--user-level) * 0.10));
    }

    .orb-tone.thinking {
      background:
        radial-gradient(circle at 50% 48%, rgba(var(--state-rgb), 0.16), transparent 48%),
        radial-gradient(circle at 28% 28%, rgba(var(--state-rgb-soft), 0.12), transparent 24%);
      opacity: calc(0.08 + var(--orb-energy) * 0.10 + var(--assistant-level) * 0.04);
      transform: scale(calc(0.94 + var(--orb-energy) * 0.06));
    }

    .orb-tone.speaking {
      background:
        radial-gradient(circle at 48% 50%, rgba(var(--state-rgb), 0.18), transparent 46%),
        radial-gradient(circle at 30% 24%, rgba(var(--state-rgb-soft), 0.12), transparent 24%),
        radial-gradient(circle at 68% 72%, rgba(var(--state-rgb), 0.14), transparent 32%);
      opacity: calc(0.07 + var(--assistant-level) * 0.16 + var(--orb-energy) * 0.06);
      transform: scale(calc(0.94 + var(--assistant-level) * 0.08));
    }

    .orb-core {
      background:
        radial-gradient(circle at 38% 32%, rgba(255, 255, 255, 0.12) 0%, transparent 18%),
        radial-gradient(circle at 70% 68%, rgba(var(--state-rgb), 0.16) 0%, transparent 24%),
        radial-gradient(circle at 50% 55%, rgba(15, 17, 34, 0.0) 0%, rgba(5, 6, 16, 0.22) 58%, rgba(0, 0, 0, 0.40) 100%);
      mix-blend-mode: screen;
      opacity: calc(0.58 + var(--orb-energy) * 0.28 + var(--assistant-level) * 0.18);
      transform: scale(calc(1 + var(--assistant-level) * 0.05));
    }

    .orb-voice {
      inset: 15%;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.16) 0%, rgba(var(--state-rgb), 0.22) 24%, rgba(var(--state-rgb), 0.08) 48%, transparent 72%);
      mix-blend-mode: screen;
      opacity: calc(var(--assistant-level) * 0.9);
      transform: scale(calc(0.76 + var(--assistant-level) * 0.34));
      filter: blur(calc(8px - var(--assistant-level) * 3px));
      transition: opacity 120ms linear, transform 120ms linear, filter 120ms linear;
    }

    .orb-plasma {
      inset: -14%;
      background:
        conic-gradient(from 220deg,
          rgba(var(--state-rgb), 0.06),
          rgba(var(--state-rgb), 0.32),
          rgba(255, 255, 255, 0.04),
          rgba(var(--state-rgb-soft), 0.28),
          rgba(var(--state-rgb), 0.08),
          rgba(var(--state-rgb), 0.06));
      filter: blur(calc(18px - var(--assistant-level) * 4px));
      opacity: calc(0.24 + var(--orb-energy) * 0.48 + var(--assistant-level) * 0.2);
      mix-blend-mode: screen;
      animation: plasma-swirl 14s linear infinite;
    }

    .orb-sheen {
      inset: 8%;
      background:
        radial-gradient(circle at 30% 18%, rgba(255, 255, 255, 0.24) 0%, rgba(255, 255, 255, 0.08) 10%, transparent 34%),
        linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 34%, transparent 64%, rgba(255, 255, 255, 0.04));
      opacity: calc(0.44 + var(--orb-energy) * 0.26 + var(--assistant-level) * 0.1);
      filter: blur(1px);
      animation: sheen-drift 7s ease-in-out infinite;
    }

    .orb-grid {
      inset: 5%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow:
        inset 0 0 0 1px rgba(var(--state-rgb), 0.10),
        inset 0 0 42px rgba(var(--state-rgb), 0.10);
      opacity: calc(0.42 + var(--orb-energy) * 0.18 + var(--assistant-level) * 0.08);
    }

    .orb-grid::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        repeating-linear-gradient(135deg,
          rgba(255, 255, 255, 0.018) 0 2px,
          transparent 2px 10px);
      mix-blend-mode: soft-light;
      opacity: 0.65;
    }

    /* ── Tap hint ── */
    .tap-hint {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
      animation: hint-pulse 2s ease-in-out infinite;
    }

    @keyframes hint-pulse {

      0%,
      100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    /* ── State colours ── */
    .state-idle {
      --state-rgb: 89, 116, 255;
      --state-rgb-soft: 58, 71, 178;
      --orb-energy: 0.16;
      --orb-scale: 1;
    }

    .state-idle .orb-ring {
      opacity: 0;
      border-color: transparent;
    }

    .state-idle .orb-backdrop {
      opacity: 0.42;
    }

    .state-idle .orb-halo {
      opacity: 0.18;
      animation-duration: 18s;
    }

    .state-listening {
      --state-rgb: 0, 255, 170;
      --state-rgb-soft: 9, 148, 112;
      --orb-scale: 1.01;
    }

    .state-listening .orb {
      box-shadow:
        0 26px 50px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(var(--state-rgb), 0.22),
        0 0 54px rgba(var(--state-rgb), 0.18),
        inset 0 1px 1px rgba(255, 255, 255, 0.08),
        inset 0 -24px 30px rgba(0, 0, 0, 0.36);
    }

    .state-listening .orb-ring {
      border-color: rgba(var(--state-rgb), 0.32);
    }

    .state-listening .orb-halo {
      animation-duration: 9s;
    }

    .state-listening .orb-plasma {
      animation-duration: 10s;
    }

    .state-thinking {
      --state-rgb: 72, 224, 255;
      --state-rgb-soft: 22, 96, 191;
      --orb-energy: 0.24;
      --orb-scale: 1.016;
      --orb-tilt-x: 2deg;
      --orb-tilt-y: -2deg;
    }

    .state-thinking .orb {
      box-shadow:
        0 24px 48px rgba(0, 0, 0, 0.42),
        0 0 0 1px rgba(var(--state-rgb), 0.22),
        0 0 42px rgba(var(--state-rgb), 0.22),
        inset 0 1px 1px rgba(255, 255, 255, 0.08),
        inset 0 -24px 30px rgba(0, 0, 0, 0.36);
    }

    .state-thinking .orb-ring {
      border-color: rgba(var(--state-rgb), 0.32);
      box-shadow: 0 0 24px rgba(var(--state-rgb), 0.18);
    }

    .state-thinking .orb-halo {
      animation-duration: 5.8s;
    }

    .state-thinking .orb-plasma {
      animation-duration: 7.2s;
    }

    .state-thinking .orb-sheen {
      animation-duration: 4.8s;
    }

    .state-speaking {
      --state-rgb: 255, 74, 201;
      --state-rgb-soft: 154, 60, 235;
      --orb-energy: 0.42;
      --orb-scale: 1.028;
      --orb-tilt-x: -2deg;
      --orb-tilt-y: 2deg;
    }

    .state-speaking .orb {
      box-shadow:
        0 28px 56px rgba(0, 0, 0, 0.48),
        0 0 0 1px rgba(var(--state-rgb), 0.28),
        0 0 70px rgba(var(--state-rgb), 0.28),
        inset 0 1px 1px rgba(255, 255, 255, 0.09),
        inset 0 -28px 36px rgba(0, 0, 0, 0.40);
    }

    .state-speaking .orb-ring {
      border-color: rgba(var(--state-rgb), 0.36);
      box-shadow: 0 0 36px rgba(var(--state-rgb), 0.2);
    }

    .state-speaking .orb-halo {
      animation-duration: 3.8s;
    }

    .state-speaking .orb-plasma {
      animation-duration: 4.2s;
    }

    .state-speaking .orb-sheen {
      animation-duration: 2.8s;
    }

    /* ── Ring visibility per state ── */
    .state-listening .orb-ring.r1 {
      opacity: 0.78;
      --ring-scale: 1.01;
    }

    .state-listening .orb-ring.r2 {
      opacity: 0.44;
      --ring-scale: 1.03;
    }

    .state-listening .orb-ring.r3 {
      opacity: 0.18;
      --ring-scale: 1.05;
    }

    .state-thinking .orb-ring.r1 {
      opacity: 0.56;
      --ring-scale: 1.025;
    }

    .state-thinking .orb-ring.r2 {
      opacity: 0.34;
      --ring-scale: 1.05;
    }

    .state-thinking .orb-ring.r3 {
      opacity: 0.12;
      --ring-scale: 1.08;
    }

    .state-speaking .orb-ring.r1 {
      opacity: 0.9;
      --ring-scale: 1.08;
    }

    .state-speaking .orb-ring.r2 {
      opacity: 0.56;
      --ring-scale: 1.12;
    }

    .state-speaking .orb-ring.r3 {
      opacity: 0.28;
      --ring-scale: 1.16;
    }

    /* ── Transcript area ── */
    .transcript-area {
      padding: 10px 0 14px 0;
      border-top: 1px solid var(--border);
      height: 108px;
      flex: 0 0 auto;
      opacity: 1;
      visibility: visible;
      transition: opacity 220ms ease;
    }

    .transcript-area.inactive {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .transcript-box {
      width: min(380px, 100%);
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(22, 22, 31, 0.92) 0%, rgba(13, 13, 20, 0.78) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 10px 14px 12px 14px;
      height: 78px;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .transcript-box::-webkit-scrollbar {
      width: 0;
      height: 0;
    }

    .transcript-box::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(120px 80px at 20% 0%, rgba(16, 185, 129, 0.12), transparent 60%),
        radial-gradient(120px 80px at 80% 100%, rgba(139, 92, 246, 0.10), transparent 60%);
      opacity: 0.35;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .transcript-box.live::before {
      opacity: 0.8;
    }

    .transcript-box.empty {
      border-color: rgba(255, 255, 255, 0.06);
    }

    .transcript-box.empty .transcript-label {
      color: rgba(16, 185, 129, 0.7);
    }

    .transcript-box.empty .transcript-text {
      opacity: 0.45;
    }

    .transcript-label {
      width: 100%;
      text-align: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--listening);
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    .transcript-text {
      font-size: 16px;
      line-height: 1.38;
      font-weight: 600;
      text-align: center;
      color: rgba(245, 245, 250, 0.92);
      opacity: 1;
      transition: opacity 1.2s ease, filter 1.2s ease;
      word-break: break-word;
      position: relative;
      z-index: 1;
      text-shadow: 0 1px 10px rgba(0, 0, 0, 0.25);
    }

    .transcript-text.fading {
      opacity: 0;
      filter: blur(1.5px);
    }

    /* ── End button ── */
    .end-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      background: rgba(239, 68, 68, 0.08);
      color: rgba(239, 68, 68, 0.85);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .end-btn:hover {
      background: rgba(239, 68, 68, 0.14);
      border-color: rgba(239, 68, 68, 0.5);
    }

    .end-btn svg {
      width: 16px;
      height: 16px;
    }

    .end-btn.hidden {
      display: none;
    }

    /* ── Responsive ── */
    @media (max-width: 380px) {
      .container {
        padding: 0 16px;
      }

      .header {
        padding: 22px 0 14px;
      }

      .header-brand {
        padding: 6px 10px 14px;
      }

      .header-brand h1 {
        font-size: 18px;
        line-height: 1.08;
      }

      .orb-wrapper {
        width: 222px;
        height: 222px;
      }

      .orb-section {
        gap: 14px;
      }

      .call-timer {
        font-size: 34px;
      }

      .transcript-area {
        height: 96px;
        padding: 8px 0 12px 0;
      }

      .transcript-box {
        height: 70px;
      }
    }

    @media (max-width: 480px) {
      .orb-wrapper {
        filter: drop-shadow(0 22px 50px rgba(0, 0, 0, 0.46));
      }

      .orb-backdrop {
        inset: -38px;
        filter: blur(22px);
        opacity: calc(0.56 + var(--orb-energy) * 0.52 + var(--assistant-level) * 0.12);
      }

      .orb-halo {
        inset: -16px;
        filter: blur(12px);
        opacity: calc(0.28 + var(--orb-energy) * 0.68 + var(--assistant-level) * 0.18);
      }

      .orb-aura {
        inset: -24px;
        filter: blur(26px);
      }

      .orb {
        inset: 20px;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.44),
          0 0 0 1px rgba(var(--state-rgb), 0.2),
          inset 0 1px 1px rgba(255, 255, 255, 0.07),
          inset 0 -22px 28px rgba(0, 0, 0, 0.34);
      }

      .orb-plasma {
        inset: -12%;
        opacity: calc(0.28 + var(--orb-energy) * 0.42 + var(--assistant-level) * 0.18);
      }

      .orb-sheen {
        inset: 6%;
        opacity: calc(0.48 + var(--orb-energy) * 0.22 + var(--assistant-level) * 0.08);
      }

      .orb-grid {
        inset: 4%;
        opacity: calc(0.46 + var(--orb-energy) * 0.14 + var(--assistant-level) * 0.08);
      }
    }

    @media (max-height: 820px) {
      .header {
        padding: 20px 0 12px;
      }

      .timer-row {
        padding: 14px 0;
      }

      .orb-section {
        gap: 18px;
      }

      .orb-wrapper {
        width: 220px;
        height: 220px;
      }

      .tap-hint {
        font-size: 14px;
      }

      .memory-actions {
        gap: 8px;
        margin-top: 4px;
      }

      .controls-row {
        margin: 4px 0 10px;
      }

      .transcript-area {
        height: 96px;
        padding: 8px 0 12px 0;
      }

      .transcript-box {
        height: 70px;
      }
    }

    @media (max-height: 760px) {
      .container {
        padding: 0 16px;
      }

      .header {
        padding: 16px 0 10px;
      }

      .header-brand {
        padding: 4px 8px 12px;
      }

      .header-brand h1 {
        font-size: clamp(28px, 7vw, 38px);
      }

      .timer-row {
        padding: 10px 0;
      }

      .call-timer {
        font-size: 32px;
      }

      .orb-section {
        gap: 12px;
      }

      .orb-wrapper {
        width: 204px;
        height: 204px;
      }

      .tap-hint,
      .memory-hint {
        font-size: 13px;
      }

      .memory-reset {
        padding: 7px 12px;
        font-size: 11px;
      }

      .control-btn {
        width: 48px;
        height: 48px;
      }

      .transcript-area {
        height: 88px;
        padding: 6px 0 10px 0;
      }

      .transcript-box {
        height: 64px;
        border-radius: 14px;
      }

      .transcript-text {
        font-size: 14px;
      }
    }

    @supports (-webkit-touch-callout: none) {
      .orb-backdrop,
      .orb-halo,
      .orb-aura,
      .orb-tone,
      .orb-plasma,
      .orb-sheen,
      .orb-grid,
      .orb-grid::before {
        -webkit-clip-path: circle(50% at 50% 50%);
        clip-path: circle(50% at 50% 50%);
      }

      .orb-tone {
        inset: -4%;
      }

      .orb-backdrop,
      .orb-aura {
        filter: blur(24px);
      }
    }

    /* Exact EchoStream voice.html blob */
    .orb-section {
      gap: 24px;
    }

    .orb-wrapper {
      width: 180px;
      height: 180px;
      filter: none;
      isolation: auto;
    }

    .orb-ring {
      border: 2px dashed transparent;
      opacity: 0;
      will-change: transform, opacity;
      transition: transform 0.15s ease-out, opacity 0.15s ease-out, border-color 0.3s;
      box-shadow: none !important;
    }

    .orb-ring.r1 {
      inset: -20px;
      border-style: solid;
    }

    .orb-ring.r2 {
      inset: -40px;
      border-style: dashed;
      animation: ring-spin 20s linear infinite;
    }

    .orb-ring.r3 {
      inset: -60px;
      border-style: dotted;
      animation: ring-spin 30s linear infinite reverse;
    }

    .orb {
      inset: 0;
      overflow: hidden;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--surface-2) 0%, var(--surface) 100%);
      border: 1px solid var(--border);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.05);
      transition: box-shadow 0.3s ease, transform 0.12s linear;
      will-change: transform;
      animation: none;
      -webkit-mask-image: none;
      backface-visibility: visible;
    }

    .orb-wrapper:active .orb {
      transform: scale(0.96);
    }

    .state-idle .orb-ring {
      opacity: 0;
      border-color: transparent;
    }

    .state-listening .orb {
      box-shadow: 0 0 50px var(--listening-glow), 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .state-listening .orb-ring {
      border-color: var(--listening);
    }

    .state-thinking .orb {
      box-shadow: 0 0 40px var(--thinking-glow), 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .state-thinking .orb-ring {
      border-color: var(--thinking);
      opacity: 0.3;
    }

    .state-speaking .orb {
      box-shadow: 0 0 60px var(--speaking-glow), 0 4px 24px rgba(0, 0, 0, 0.4);
    }

    .state-speaking .orb-ring {
      border-color: var(--speaking);
    }

    @media (max-width: 380px) {
      .orb-wrapper {
        width: 130px;
        height: 130px;
      }

      .orb-ring.r1 {
        inset: -15px;
      }

      .orb-ring.r2 {
        inset: -30px;
      }

      .orb-ring.r3 {
        inset: -45px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="header-brand">
        <h1>MayaClone</h1>
      </div>
    </header>

    <div class="timer-row hidden" id="timerRow">
      <div class="status-dot connected" id="statusDot"></div>
      <div class="call-timer" id="callTimer">00:00</div>
    </div>

    <main class="orb-section">
      <div class="orb-wrapper state-idle" id="orbWrapper" onclick="toggleCall()">
        <div class="orb-ring r1" id="ring1"></div>
        <div class="orb-ring r2" id="ring2"></div>
        <div class="orb-ring r3" id="ring3"></div>
        <div class="orb" id="orb"></div>
      </div>
      <p class="tap-hint" id="tapHint">Tap to start talking</p>
      <p class="memory-hint" id="nameHint">Name: <strong>not set</strong></p>
      <div class="memory-actions" id="memoryActions">
        <button class="memory-reset" id="setNameBtn" type="button" onclick="setName()">Set name</button>
        <button class="memory-reset" id="clearMemoryBtn" type="button" onclick="clearContext()">Clear Memory</button>
      </div>
    </main>

    <div class="controls-row hidden" id="controlsRow">
      <button class="control-btn" id="micBtn" type="button" title="Mute microphone" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="icon-on">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <path d="M12 19v3"></path>
          <path d="M8 22h8"></path>
        </svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="icon-off hidden">
          <path d="M4 4l16 16"></path>
          <path d="M9 9v3a3 3 0 0 0 5 2.2"></path>
          <path d="M15 8.3V5a3 3 0 0 0-5.7-1.3"></path>
          <path d="M19 10v2a7 7 0 0 1-1.6 4.5"></path>
          <path d="M5 10v2a7 7 0 0 0 7 7"></path>
          <path d="M12 19v3"></path>
          <path d="M8 22h8"></path>
        </svg>
      </button>
      <button class="control-btn" id="aiBtn" type="button" title="Mute AI audio" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="icon-on">
          <path d="M11 5L6 9H3v6h3l5 4V5z"></path>
          <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
          <path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
        </svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="icon-off hidden">
          <path d="M11 5L6 9H3v6h3l5 4V5z"></path>
          <path d="M16 9l5 5"></path>
          <path d="M21 9l-5 5"></path>
        </svg>
      </button>
    </div>

    <section class="transcript-area inactive" id="transcriptArea">
      <div class="transcript-box empty" id="transcriptBox">
        <p class="transcript-label" id="transcriptLabel">You</p>
        <p class="transcript-text" id="userTranscript">…</p>
      </div>
    </section>

    <button class="end-btn hidden" id="endBtn" onclick="stopCall()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
      End Session
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // ─── Elements ─────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const orbWrapper = $('orbWrapper');
    const orb = $('orb');
    const tapHint = $('tapHint');
    const timerRow = $('timerRow');
    const callTimer = $('callTimer');
    const transcriptArea = $('transcriptArea');
    const transcriptBox = $('transcriptBox');
    const userTranscript = $('userTranscript');
    const endBtn = $('endBtn');
    const statusDot = $('statusDot');
    const ring1 = $('ring1');
    const ring2 = $('ring2');
    const ring3 = $('ring3');
    const nameHint = $('nameHint');
    const memoryActions = $('memoryActions');
    const controlsRow = $('controlsRow');
    const micBtn = $('micBtn');
    const aiBtn = $('aiBtn');

    // ─── State ────────────────────────────────────────────────────────────
    let socket = null;
    let chatId = null;
    let audioContext = null;
    let micSourceNode = null;
    let workletNode = null;
    let mediaStream = null;
    let isConnected = false;
    let timerInterval = null;
    let timerSeconds = 0;
    let readyTimer = null;
    let voiceStreamReady = false;
    let isStoppingCall = false;
    let isMicMuted = false;
    let isAiMuted = false;
    let activeCallId = null;

    // Gapless playback
    let playbackCtx = null;
    let playbackGainNode = null;
    let playbackAnalyser = null;
    let playbackDataArray = null;
    let nextPlayTime = 0;
    let activeSources = [];
    let vadFlushTimer = null;
    let assistantFinished = false;
    let userName = '';
    let assistantTextByMessageId = Object.create(null);
    let currentAssistantMessageId = null;
    let ignoredAssistantMessageIds = new Set();
    let orbVizFrame = null;
    let pendingUserLevel = 0;
    let smoothedUserLevel = 0;
    let smoothedAssistantLevel = 0;
    let ambientPulseInterval = null;

    // ─── Local memory (browser storage) ──────────────────────────────────
    const STORAGE_CHAT_ID = 'maya_chat_id_v1';
    const STORAGE_HISTORY = 'maya_chat_history_v1';
    const MAX_HISTORY_ITEMS = 80;
    let conversationHistory = [];

    function safeJsonParse(s) {
      try { return JSON.parse(s); } catch { return null; }
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_HISTORY);
        const parsed = safeJsonParse(raw || 'null');
        if (!Array.isArray(parsed)) return [];
        return parsed
          .filter(m => m && (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string')
          .map(m => ({ role: m.role, content: String(m.content), ts: Number(m.ts || 0) || Date.now() }));
      } catch {
        return [];
      }
    }

    function saveHistory() {
      try {
        const trimmed = conversationHistory.slice(-MAX_HISTORY_ITEMS);
        localStorage.setItem(STORAGE_HISTORY, JSON.stringify(trimmed));
      } catch { }
    }

    function addToHistory(role, content) {
      const text = String(content || '').trim();
      if (!text) return;
      const last = conversationHistory[conversationHistory.length - 1];
      if (last && last.role === role && last.content === text) return;
      conversationHistory.push({ role, content: text, ts: Date.now() });
      saveHistory();
    }

    function clearLocalMemory() {
      conversationHistory = [];
      assistantTextByMessageId = Object.create(null);
      currentAssistantMessageId = null;
      ignoredAssistantMessageIds = new Set();
      try { localStorage.removeItem(STORAGE_HISTORY); } catch { }
      try { localStorage.removeItem(STORAGE_CHAT_ID); } catch { }
    }

    function getOrCreateChatId() {
      try {
        const existing = localStorage.getItem(STORAGE_CHAT_ID);
        if (existing) return existing;
        const next = 'maya-' + Math.random().toString(36).slice(2, 10);
        localStorage.setItem(STORAGE_CHAT_ID, next);
        return next;
      } catch {
        return 'maya-' + Math.random().toString(36).slice(2, 10);
      }
    }

    // ─── Orb state ────────────────────────────────────────────────────────
    let currentState = 'idle';
    function commitOrbState(state) {
      currentState = state;
      orbWrapper.className = 'orb-wrapper state-' + state;
      if (state === 'listening' || state === 'idle') {
        resetBlob();
      }
      if (state === 'idle' && smoothedUserLevel < 0.01) {
        resetRings();
      }
    }

    function setOrbState(state) {
      commitOrbState(state);
    }

    function animateRingsWithLevel(level) {
      const boosted = Math.max(0, Math.min(1, Number(level) || 0));
      const opacity = 0.3 + boosted * 0.7;
      const scale1 = 1 + boosted * 0.08;
      const scale2 = 1 + boosted * 0.06;
      const scale3 = 1 + boosted * 0.04;
      ring1.style.opacity = opacity;
      ring1.style.transform = `scale(${scale1})`;
      ring2.style.opacity = opacity * 0.7;
      ring2.style.transform = `scale(${scale2})`;
      ring3.style.opacity = opacity * 0.5;
      ring3.style.transform = `scale(${scale3})`;
    }

    function resetRings() {
      ring1.style.opacity = '0';
      ring1.style.transform = 'scale(1)';
      ring2.style.opacity = '0';
      ring2.style.transform = 'scale(1)';
      ring3.style.opacity = '0';
      ring3.style.transform = 'scale(1)';
    }

    function startAmbientPulse() {
      if (ambientPulseInterval) return;
      ambientPulseInterval = setInterval(() => {
        if (currentState === 'idle' || currentState === 'listening') {
          const start = Date.now();
          function pulse() {
            const elapsed = Date.now() - start;
            if (elapsed > 1200) return;
            const progress = elapsed / 1200;
            const wave = Math.sin(progress * Math.PI);
            const opacity = 0.15 + wave * 0.35;
            ring1.style.opacity = opacity;
            ring1.style.transform = `scale(${1 + wave * 0.05})`;
            ring2.style.opacity = opacity * 0.7;
            ring2.style.transform = `scale(${1 + wave * 0.04})`;
            ring3.style.opacity = opacity * 0.4;
            ring3.style.transform = `scale(${1 + wave * 0.03})`;
            requestAnimationFrame(pulse);
          }
          pulse();
        }
      }, 5000);
    }

    function stopAmbientPulse() {
      if (!ambientPulseInterval) return;
      clearInterval(ambientPulseInterval);
      ambientPulseInterval = null;
    }

    function samplePlaybackLevel() {
      if (!playbackAnalyser || !playbackDataArray || !activeSources.length) return 0;
      playbackAnalyser.getByteFrequencyData(playbackDataArray);
      let sum = 0;
      const sampleCount = Math.min(40, playbackDataArray.length);
      for (let i = 0; i < sampleCount; i++) sum += playbackDataArray[i];
      return Math.min(1, (sum / sampleCount) / 180);
    }

    function computeSampleLevel(samples) {
      if (!samples?.length) return 0;
      let sumSquares = 0;
      const step = samples.length > 1024 ? 2 : 1;
      let count = 0;
      for (let i = 0; i < samples.length; i += step) {
        const sample = Number(samples[i]) || 0;
        sumSquares += sample * sample;
        count += 1;
      }
      if (!count) return 0;
      const rms = Math.sqrt(sumSquares / count);
      return Math.min(1, rms * 5.2);
    }

    function animateBlobWithLevel(level) {
      const boosted = Math.max(0, Math.min(1, Number(level) || 0));
      const scale = 1 + boosted * 0.12;
      orb.style.transform = `scale(${scale})`;
    }

    function resetBlob() {
      orb.style.transform = 'scale(1)';
    }

    function startOrbVisualization() {
      if (orbVizFrame) return;
      const animate = () => {
        const userTarget = (isConnected && !isMicMuted) ? pendingUserLevel : 0;
        const assistantTarget = (isConnected && !isAiMuted) ? samplePlaybackLevel() : 0;

        smoothedUserLevel = Math.max(userTarget, smoothedUserLevel * 0.82);
        smoothedAssistantLevel = Math.max(assistantTarget, smoothedAssistantLevel * 0.86);
        pendingUserLevel *= 0.56;

        if (currentState === 'listening' && isConnected && !isMicMuted) {
          animateRingsWithLevel(smoothedUserLevel);
        } else if (currentState !== 'thinking' && currentState !== 'speaking') {
          resetRings();
        }

        if (currentState === 'speaking' && isConnected && !isAiMuted) {
          animateBlobWithLevel(smoothedAssistantLevel);
        } else {
          resetBlob();
        }
        orbVizFrame = requestAnimationFrame(animate);
      };
      animate();
    }

    function stopOrbVisualization() {
      if (orbVizFrame) cancelAnimationFrame(orbVizFrame);
      orbVizFrame = null;
      pendingUserLevel = 0;
      smoothedUserLevel = 0;
      smoothedAssistantLevel = 0;
      stopAmbientPulse();
      resetRings();
      resetBlob();
    }

    // Resample Float32 PCM to 16kHz and convert to Int16 (linear16).
    function resample16k(float32, srcRate) {
      const targetRate = 16000;
      if (srcRate === targetRate) {
        const out = new Int16Array(float32.length);
        for (let i = 0; i < float32.length; i++) {
          out[i] = Math.max(-32768, Math.min(32767, Math.round(float32[i] * 32767)));
        }
        return out;
      }
      const ratio = srcRate / targetRate;
      const outLen = Math.floor(float32.length / ratio);
      const out = new Int16Array(outLen);
      for (let i = 0; i < outLen; i++) {
        const srcPos = i * ratio;
        const srcIdx = Math.floor(srcPos);
        const frac = srcPos - srcIdx;
        const s0 = float32[srcIdx] || 0;
        const s1 = float32[srcIdx + 1] || s0;
        const interpolated = s0 + (s1 - s0) * frac;
        out[i] = Math.max(-32768, Math.min(32767, Math.round(interpolated * 32767)));
      }
      return out;
    }

    // ─── Timer ───────────────────────────────────────────────────────────
    function startTimer() {
      timerSeconds = 0;
      timerRow.classList.remove('hidden');
      tapHint.style.display = 'none';
      timerInterval = setInterval(() => {
        timerSeconds++;
        const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
        const s = String(timerSeconds % 60).padStart(2, '0');
        callTimer.textContent = m + ':' + s;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      timerRow.classList.add('hidden');
      tapHint.style.display = '';
      callTimer.textContent = '00:00';
    }

    function setActiveCallUi(active) {
      nameHint?.classList.toggle('hidden', active);
      memoryActions?.classList.toggle('hidden', active);
      controlsRow?.classList.toggle('hidden', !active);
      endBtn?.classList.toggle('hidden', !active);
      if (active) startAmbientPulse();
      else stopAmbientPulse();
    }

    function syncStatusDot() {
      statusDot?.classList.toggle('connected', isConnected && voiceStreamReady);
    }

    function updatePlaybackMute() {
      if (!playbackCtx || !playbackGainNode) return;
      const target = isAiMuted ? 0 : 1;
      const now = playbackCtx.currentTime;
      try { playbackGainNode.gain.cancelScheduledValues(now); } catch { }
      try { playbackGainNode.gain.setValueAtTime(target, now); } catch { }
    }

    function syncControlUi() {
      if (micBtn) {
        micBtn.classList.toggle('muted', isMicMuted);
        micBtn.querySelector('.icon-on')?.classList.toggle('hidden', isMicMuted);
        micBtn.querySelector('.icon-off')?.classList.toggle('hidden', !isMicMuted);
        micBtn.setAttribute('aria-pressed', isMicMuted ? 'true' : 'false');
        micBtn.title = isMicMuted ? 'Unmute microphone' : 'Mute microphone';
      }
      if (aiBtn) {
        aiBtn.classList.toggle('muted', isAiMuted);
        aiBtn.querySelector('.icon-on')?.classList.toggle('hidden', isAiMuted);
        aiBtn.querySelector('.icon-off')?.classList.toggle('hidden', !isAiMuted);
        aiBtn.setAttribute('aria-pressed', isAiMuted ? 'true' : 'false');
        aiBtn.title = isAiMuted ? 'Unmute AI audio' : 'Mute AI audio';
      }
      updatePlaybackMute();
    }

    function toggleMicMute(event) {
      event?.preventDefault?.();
      event?.stopPropagation?.();
      event?.stopImmediatePropagation?.();
      if (!socket) return;
      isMicMuted = !isMicMuted;
      syncControlUi();
      if (isMicMuted) resetRings();
    }

    function toggleAiMute(event) {
      event?.preventDefault?.();
      event?.stopPropagation?.();
      event?.stopImmediatePropagation?.();
      if (!socket) return;
      isAiMuted = !isAiMuted;
      syncControlUi();
    }

    // ─── Transcript helpers ───────────────────────────────────────────────
    let fadeTimer = null;
    function showTranscript(text, isFinal) {
      transcriptArea.classList.remove('inactive');
      transcriptBox.classList.remove('empty');
      transcriptBox.classList.add('live');
      userTranscript.classList.remove('fading');
      clearTimeout(fadeTimer);
      if (fadeTimer) clearTimeout(fadeTimer);
      userTranscript.textContent = text;
      if (isFinal) {
        transcriptBox.classList.remove('live');
        fadeTimer = setTimeout(() => {
          userTranscript.classList.add('fading');
          setTimeout(() => {
            userTranscript.textContent = '…';
            transcriptBox.classList.add('empty');
            userTranscript.classList.remove('fading');
          }, 1200);
        }, 2200);
      }
    }

    // ─── Toggle call ─────────────────────────────────────────────────────
    async function toggleCall() {
      if (isConnected) stopCall();
      else await startCall();
    }

    async function requestMicrophoneStream() {
      const constraints = {
        audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 },
      };

      if (navigator.mediaDevices?.getUserMedia) {
        return navigator.mediaDevices.getUserMedia(constraints);
      }

      const legacyGetUserMedia =
        navigator.getUserMedia ||
        navigator.webkitGetUserMedia ||
        navigator.mozGetUserMedia;

      if (legacyGetUserMedia) {
        return new Promise((resolve, reject) => {
          legacyGetUserMedia.call(navigator, constraints, resolve, reject);
        });
      }

      const secureHint =
        location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1'
          ? 'Open MayaClone over HTTPS (or use localhost) to allow microphone access.'
          : 'This browser does not expose getUserMedia on the current page.';

      throw new Error(`Microphone API unavailable. ${secureHint}`);
    }

    async function startCall() {
      try {
        if (socket || isConnected || isStoppingCall) return;
        isStoppingCall = false;
        voiceStreamReady = false;
        assistantFinished = false;
        activeCallId = null;
        setOrbState('thinking');
        tapHint.textContent = 'Connecting…';
        syncStatusDot();

        conversationHistory = loadHistory();
        chatId = getOrCreateChatId();

        // Create AudioContexts early (Safari/iOS can require user-gesture timing).
        audioContext = new AudioContext({ sampleRate: 16000 });
        playbackCtx = new AudioContext({ sampleRate: 44100 });
        playbackGainNode = playbackCtx.createGain();
        playbackGainNode.gain.value = isAiMuted ? 0 : 1;
        playbackAnalyser = playbackCtx.createAnalyser();
        playbackAnalyser.fftSize = 256;
        playbackDataArray = new Uint8Array(playbackAnalyser.frequencyBinCount);
        playbackGainNode.connect(playbackAnalyser);
        playbackAnalyser.connect(playbackCtx.destination);
        nextPlayTime = 0;
        try { await audioContext.resume(); } catch { }
        try { await playbackCtx.resume(); } catch { }

        // ── Step 1: Request mic permission BEFORE opening socket ──
        // This way getUserMedia resolves (or fails fast) before socket tries to connect.
        mediaStream = await requestMicrophoneStream();

        // Set up AudioWorklet capture (independent of socket connection).
        await audioContext.audioWorklet.addModule('/audio-worklet.js');
        micSourceNode = audioContext.createMediaStreamSource(mediaStream);
        workletNode = new AudioWorkletNode(audioContext, 'audio-capture-processor');

        workletNode.port.onmessage = (e) => {
          if (e.data.type !== 'audio' || !socket?.connected) return;
          pendingUserLevel = Math.max(pendingUserLevel, computeSampleLevel(e.data.samples));
          if (isMicMuted) return;
          const samples = e.data.samples;
          const srcRate = e.data.sampleRate;
          const int16 = resample16k(samples, srcRate);
          const bytes = new Uint8Array(int16.buffer);
          socket.emit('client:voice_audio_chunk', { chatId, sampleRate: 16000, encoding: 'linear16', audio: bytes });
        };

        micSourceNode.connect(workletNode);
        workletNode.connect(audioContext.destination);
        workletNode.port.postMessage({ command: 'start' });
        startOrbVisualization();

        // ── Step 2: Open socket, register handlers, then connect ──
        socket = io({ transports: ['websocket'], reconnection: false, autoConnect: false });

        socket.on('connect', () => {
          // Notify server
          const historyForServer = conversationHistory
            .slice(-MAX_HISTORY_ITEMS)
            .map(m => ({ role: m.role, content: m.content }));
          socket.emit('client:voice_stream_start', { chatId, userName, history: historyForServer });
          tapHint.textContent = 'Preparing voice stream…';
          readyTimer = setTimeout(() => {
            if (voiceStreamReady || isStoppingCall) return;
            console.error('[Voice] voice_stream_ready timeout');
            stopCall({ skipServerStop: true });
            setOrbState('idle');
            tapHint.textContent = 'Voice stream failed to start';
          }, 12000);
        });

        socket.on('server:voice_stream_ready', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          clearTimeout(readyTimer);
          readyTimer = null;
          activeCallId = d?.callId || null;
          voiceStreamReady = true;
          isConnected = true;
          syncStatusDot();
          setActiveCallUi(true);
          setOrbState('listening');
          startTimer();
          transcriptArea.classList.remove('inactive');
          tapHint.textContent = 'Tap orb to end the call';
        });

        socket.on('server:voice_stream_ended', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          if (activeCallId && d?.callId && d.callId !== activeCallId) return;
          if (isStoppingCall) return;
          const reason = String(d?.reason || 'ended');
          stopCall({ fromServer: true, skipServerStop: true });
          tapHint.textContent = reason === 'client_disconnect' ? 'Connection ended' : 'Call ended';
        });

        socket.on('server:status', (d) => {
          if (!voiceStreamReady) return;
          if (d.state === 'listening') {
            // Don't override "speaking" while audio is playing.
            if (currentState !== 'speaking') setOrbState('listening');
          } else if (d.state === 'thinking') {
            if (currentState !== 'speaking') setOrbState('thinking');
          }
        });

        socket.on('server:vad_speech_start', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          if (vadFlushTimer) clearTimeout(vadFlushTimer);
          // Debounce + only flush if we're actually playing AI audio.
          if (activeSources.length > 0) {
            vadFlushTimer = setTimeout(() => {
              flushAudio();
              vadFlushTimer = null;
              setOrbState('listening');
            }, 150);
          } else if (currentState !== 'speaking') {
            setOrbState('listening');
          }
        });

        socket.on('server:vad_speech_end', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          if (vadFlushTimer) {
            clearTimeout(vadFlushTimer);
            vadFlushTimer = null;
          }
          if (currentState !== 'speaking') setOrbState('thinking');
        });

        socket.on('server:user_voice_message', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          if (d?.isFinal && currentAssistantMessageId) {
            ignoredAssistantMessageIds.add(currentAssistantMessageId);
            if (ignoredAssistantMessageIds.size > 12) {
              const first = ignoredAssistantMessageIds.values().next();
              if (!first.done) ignoredAssistantMessageIds.delete(first.value);
            }
            flushAudio();
            currentAssistantMessageId = null;
            assistantFinished = false;
            setOrbState('listening');
          }
          showTranscript(d.text, !!d.isFinal);
          if (d?.isFinal) addToHistory('user', d.text);
        });

        socket.on('server:assistant_message_started', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          assistantFinished = false;
          setOrbState('speaking');
          if (d?.messageId) {
            currentAssistantMessageId = d.messageId;
            ignoredAssistantMessageIds.delete(d.messageId);
            assistantTextByMessageId[d.messageId] = '';
          }
        });

        socket.on('server:sentence_audio', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          if (!d.audio) return;
          if (d?.messageId && ignoredAssistantMessageIds.has(d.messageId)) return;
          try {
            setOrbState('speaking');
            if (d?.messageId && typeof d.text === 'string' && d.text.trim()) {
              const prev = assistantTextByMessageId[d.messageId] || '';
              assistantTextByMessageId[d.messageId] = (prev ? (prev + ' ') : '') + d.text.trim();
            }
            let raw = null;
            if (d.audio instanceof ArrayBuffer) {
              raw = d.audio;
            } else if (d.audio?.buffer && d.audio?.byteLength != null) {
              raw = d.audio.buffer.slice(d.audio.byteOffset, d.audio.byteOffset + d.audio.byteLength);
            } else if (d.audio?.type === 'Buffer' && Array.isArray(d.audio.data)) {
              raw = Uint8Array.from(d.audio.data).buffer;
            } else {
              raw = d.audio;
            }
            queueAudio(new Int16Array(raw), d.sampleRate || 44100);
          } catch (e) {
            console.error('[Audio] Failed to queue sentence audio', e);
          }
        });

        socket.on('server:assistant_message_finished', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          if (d?.messageId && ignoredAssistantMessageIds.has(d.messageId)) {
            delete assistantTextByMessageId[d.messageId];
            if (currentAssistantMessageId === d.messageId) currentAssistantMessageId = null;
            return;
          }
          assistantFinished = true;
          if (d?.messageId && assistantTextByMessageId[d.messageId]) {
            addToHistory('assistant', assistantTextByMessageId[d.messageId]);
            delete assistantTextByMessageId[d.messageId];
          }
          if (d?.messageId && currentAssistantMessageId === d.messageId) currentAssistantMessageId = null;
          // If there is no audio scheduled/playing, we can return to listening immediately.
          if (activeSources.length === 0) setOrbState('listening');
        });

        socket.on('server:assistant_message_cancelled', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          if (d?.messageId) {
            ignoredAssistantMessageIds.add(d.messageId);
            delete assistantTextByMessageId[d.messageId];
            if (currentAssistantMessageId === d.messageId) currentAssistantMessageId = null;
          } else if (currentAssistantMessageId) {
            ignoredAssistantMessageIds.add(currentAssistantMessageId);
            delete assistantTextByMessageId[currentAssistantMessageId];
            currentAssistantMessageId = null;
          }
          if (ignoredAssistantMessageIds.size > 12) {
            const first = ignoredAssistantMessageIds.values().next();
            if (!first.done) ignoredAssistantMessageIds.delete(first.value);
          }
          flushAudio();
          setOrbState('listening');
        });

        socket.on('server:error', (d) => {
          console.error('[MayaClone]', d.message);
        });

        socket.on('server:context_cleared', (d) => {
          if (d?.chatId && d.chatId !== chatId) return;
          flushAudio();
          userTranscript.textContent = '…';
          transcriptBox.classList.add('empty');
          transcriptBox.classList.remove('live');
          setOrbState('listening');
        });

        socket.on('disconnect', () => {
          if (isStoppingCall) return;
          stopCall({ fromServer: true, skipServerStop: true });
          if (!voiceStreamReady) {
            tapHint.textContent = 'Connection closed';
          }
        });

        socket.on('connect_error', (err) => {
          console.error('[Socket] connect_error', err.message);
          stopCall();
          setOrbState('idle');
          tapHint.textContent = 'Connection failed — tap to retry';
        });

        socket.connect();

      } catch (err) {
        console.error('Start failed:', err);
        try { stopCall(); } catch { }
        const message = String(err?.message || err || 'Unknown error');
        alert('Could not start: ' + message);
        setOrbState('idle');
        tapHint.textContent = /https|microphone api unavailable/i.test(message)
          ? 'Microphone requires HTTPS or localhost'
          : 'Tap to start talking';
      }
    }

    function updateNameUi() {
      const clean = String(userName || '').trim();
      if (!nameHint) return;
      nameHint.innerHTML = clean
        ? `Name: <strong>${clean.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</strong>`
        : 'Name: <strong>not set</strong>';
    }

    function setName() {
      const current = String(userName || '').trim();
      const next = prompt('Your name (used in the system prompt):', current);
      if (next == null) return;
      userName = String(next || '').trim();
      try { localStorage.setItem('maya_user_name', userName); } catch { }
      updateNameUi();
      if (socket?.connected) {
        socket.emit('client:update_user_name', { chatId, userName });
      }
    }

    function clearContext() {
      flushAudio();
      userTranscript.textContent = '…';
      transcriptBox.classList.add('empty');
      transcriptBox.classList.remove('live');
      clearLocalMemory();
      if (socket?.connected) socket.emit('client:clear_context', { chatId });
    }

    try {
      userName = localStorage.getItem('maya_user_name') || '';
    } catch { }
    updateNameUi();
    nameHint?.classList.remove('hidden');
    memoryActions?.classList.remove('hidden');
    controlsRow?.classList.add('hidden');
    syncControlUi();
    micBtn?.addEventListener('click', toggleMicMute);
    micBtn?.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });
    aiBtn?.addEventListener('click', toggleAiMute);
    aiBtn?.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      event.stopPropagation();
    });


    function stopCall({ fromServer = false, skipServerStop = false } = {}) {
      if (isStoppingCall) return;
      isStoppingCall = true;
      clearTimeout(readyTimer);
      readyTimer = null;
      workletNode?.port.postMessage({ command: 'stop' });
      stopOrbVisualization();
      if (!fromServer && !skipServerStop && socket?.connected) {
        try { socket.emit('client:voice_stream_stop', { chatId }); } catch { }
      }
      try { socket?.disconnect(); } catch { }
      assistantTextByMessageId = Object.create(null);
      micSourceNode?.disconnect?.();
      mediaStream?.getTracks().forEach(t => t.stop());
      audioContext?.close().catch(() => { });
      try {
        for (const src of activeSources) {
          try { src.stop(); } catch { }
        }
      } catch { }
      activeSources = [];
      playbackCtx?.close().catch(() => { });

      socket = null; mediaStream = null; audioContext = null;
      micSourceNode = null;
      workletNode = null; playbackCtx = null; playbackGainNode = null; playbackAnalyser = null; playbackDataArray = null; nextPlayTime = 0;
      isConnected = false;
      voiceStreamReady = false;
      activeCallId = null;
      syncStatusDot();

      setActiveCallUi(false);
      setOrbState('idle');
      tapHint.textContent = 'Tap to start talking';
      stopTimer();
      transcriptArea.classList.add('inactive');
      userTranscript.textContent = '…';
      transcriptBox.classList.add('empty');
      transcriptBox.classList.remove('live');
      isStoppingCall = false;
    }

    // ─── Gapless audio playback ───────────────────────────────────────────
    function queueAudio(int16, sampleRate) {
      if (!playbackCtx) return;
      if (playbackCtx.state === 'suspended') {
        playbackCtx.resume().catch(() => { });
      }
      const float32 = new Float32Array(int16.length);
      for (let i = 0; i < int16.length; i++) float32[i] = int16[i] / 32768;

      const buf = playbackCtx.createBuffer(1, float32.length, sampleRate);
      buf.getChannelData(0).set(float32);

      const now = playbackCtx.currentTime;
      if (nextPlayTime < now) nextPlayTime = now;

      const src = playbackCtx.createBufferSource();
      src.buffer = buf;
      src.connect(playbackGainNode || playbackCtx.destination);
      src.start(nextPlayTime);
      activeSources.push(src);
      src.onended = () => {
        activeSources = activeSources.filter(s => s !== src);
        if (assistantFinished && activeSources.length === 0) {
          setOrbState('listening');
        }
      };
      nextPlayTime += buf.duration;
    }

    function flushAudio() {
      if (!playbackCtx) return;
      try {
        for (const src of activeSources) {
          try { src.stop(); } catch { }
        }
      } catch { }
      activeSources = [];
      nextPlayTime = playbackCtx.currentTime;
      assistantFinished = false;
    }
  </script>
</body>
